name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
          # Only mark the PR for auto-merge: GitHub merges it once the required
          # status checks of the main branch ruleset have passed. Merging right
          # away fails with "Repository rule violations found" while tests run.
          # Needs "Allow auto-merge" in the repository settings.
          use-github-auto-merge: true
          # Never auto-merge runtime major bumps (e.g. @maxhub/max-bot-api),
          # only patch-level production updates and minor devDependency updates.
          target-development: minor
          target-production: patch
